<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskSpace Pro | Workspace</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Auth View -->
        <div id="auth-box" class="auth-card">
            <div class="auth-header">
                <i class="fa-solid fa-bolt-lightning logo-icon"></i>
                <h2 id="auth-title">Welcome Back</h2>
                <p>Sign in to your intelligent workspace</p>
            </div>
            <div class="form-group">
                <input type="text" id="username" placeholder="Full Name" style="display:none;">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password">
                <button id="auth-btn" class="btn btn-primary btn-block" onclick="handleAuth()">Sign In</button>
            </div>
            <p onclick="toggleAuthMode()" id="toggle-link">Don't have an account? Register</p>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard" class="dashboard" style="display:none;">
            <!-- Top Navbar -->
            <header class="navbar">
                <div class="brand">
                    <i class="fa-solid fa-bolt-lightning"></i>
                    <span>TaskSpace <small class="badge-pro">AI</small></span>
                </div>
                <div class="user-profile">
                    <button class="btn btn-ai-toggle" onclick="toggleAIPanel()">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> AI Assistant
                    </button>
                    <span class="user-greeting"><i class="fa-regular fa-circle-user"></i> <span id="user-display"></span></span>
                    <button class="btn btn-logout" onclick="logout()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </header>

            <!-- Metrics Overview -->
            <section class="stats-container">
                <div class="stat-card">
                    <div class="stat-icon bg-indigo"><i class="fa-solid fa-list-check"></i></div>
                    <div class="stat-info">
                        <p>Total Tasks</p>
                        <h3 id="stat-total">0</h3>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-amber"><i class="fa-solid fa-clock"></i></div>
                    <div class="stat-info">
                        <p>In Progress</p>
                        <h3 id="stat-pending">0</h3>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-emerald"><i class="fa-solid fa-circle-check"></i></div>
                    <div class="stat-info">
                        <p>Completed</p>
                        <h3 id="stat-completed">0</h3>
                    </div>
                </div>
            </section>

            <!-- Controls Toolbar (Single Primary Action) -->
            <section class="toolbar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search tasks by title or detail..." oninput="filterTasks()">
                </div>
                <div class="filter-group">
                    <select id="filter-status" onchange="filterTasks()">
                        <option value="all">All Statuses</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                    <button class="btn btn-primary" onclick="openModal()">
                        <i class="fa-solid fa-plus"></i> New Task
                    </button>
                </div>
            </section>

            <!-- Task List Display -->
            <main>
                <div id="task-list" class="task-grid"></div>
            </main>
        </div>
    </div>

    <!-- Slide-out AI Assistant Panel -->
    <aside id="ai-drawer" class="ai-drawer">
        <div class="ai-drawer-header">
            <h3><i class="fa-solid fa-wand-magic-sparkles"></i> AI Task Generator</h3>
            <span class="close-btn" onclick="toggleAIPanel()">&times;</span>
        </div>
        <div class="ai-drawer-body">
            <p class="ai-hint">Describe a goal or project, and the AI assistant will break it down into actionable tasks for you.</p>
            <textarea id="ai-prompt" placeholder="e.g., Plan a 3-step video production workflow or prepare for database architecture exam..."></textarea>
            <button class="btn btn-ai-action" onclick="generateAITasks()">
                <i class="fa-solid fa-brain"></i> Generate Tasks
            </button>
            <div id="ai-suggestions" class="ai-suggestions-list"></div>
        </div>
    </aside>

    <!-- Create Task Modal -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create New Task</h3>
                <span class="close-btn" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <input type="text" id="task-title" placeholder="Task Title (e.g. Set up IoT Gateway Architecture)">
                <textarea id="task-desc" placeholder="Details or sub-notes..."></textarea>
                <button class="btn btn-primary btn-block" onclick="createTask()">Save Task</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

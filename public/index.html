<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Auth Section -->
        <div id="auth-container" class="card">
            <h2 id="auth-title">Login</h2>
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter your password">
                </div>
                <button type="submit" id="auth-submit-btn" class="btn btn-primary">Login</button>
            </form>
            <p class="toggle-auth">
                <span id="auth-toggle-text">Don't have an account?</span>
                <button id="toggle-auth-btn" class="btn-link">Register</button>
            </p>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-container" class="card hidden">
            <header class="dashboard-header">
                <h2>My Tasks</h2>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </header>

            <!-- Task Creation Form -->
            <form id="task-form" class="task-form">
                <input type="text" id="task-title" placeholder="Task Title" required>
                <input type="text" id="task-desc" placeholder="Task Description (optional)">
                <button type="submit" class="btn btn-primary">Add Task</button>
            </form>

            <!-- Task List -->
            <ul id="task-list" class="task-list"></ul>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
